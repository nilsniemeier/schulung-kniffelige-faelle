<!doctype html>

<head>

<title>Kniffelige Fälle aus der Praxis</title>
<style>
  :root {
    --ink: #1F2328; --slate: #2B3138; --light: #F1EFEB; --accent: #D9482B; --green: #2E7D5B;
    --amber: #C98A00; --muted: #6B7178; --softw: #C9CDD2; --gold: #F0B84A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #54463d 0%, #2a221d 55%, #0f0c0b 100%);
    font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; }
  #deck { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center;
    box-shadow: 3px 3px 0 #e9e5dc, 6px 6px 0 #d8d3c6, 9px 9px 0 #c3bdae, 26px 34px 70px rgba(0,0,0,.7); }
  #stack { position: absolute; inset: 0; perspective: 2200px; background: #fff; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; color: var(--ink); overflow: hidden;
    background: var(--rings) no-repeat, var(--grain),
      radial-gradient(circle at 82% 6%, #ffffff 0, #faf8f3 45%, #efeadf 100%);
    visibility: hidden; opacity: 0; pointer-events: none;
  }
  .slide.dark {
    color: #fff;
    background: var(--grain), radial-gradient(circle at 18% 12%, #323a43 0, #1F2328 55%, #111316 100%);
  }
  .slide.active { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
  /* Seite umblättern: Folie wird in Streifen zerlegt, die sich nacheinander biegen */
  .curl, .seg { transform-style: preserve-3d; }
  .curl { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .seg { position: absolute; top: 0; height: 720px; transform-origin: left center; }
  .seg-front, .seg-back { position: absolute; inset: 0; backface-visibility: hidden; }
  .seg-front { overflow: hidden; }
  .seg-front .slide { visibility: visible; opacity: 1; pointer-events: none; }
  .shade { position: absolute; inset: 0; background: #000; opacity: 0; }
  .seg-back { transform: rotateY(180deg); background: linear-gradient(90deg, #e6e1d6, #f4f0e7 60%, #e3ded2); }
  .cast { position: absolute; top: 0; height: 720px; width: 240px; z-index: 2; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.18) 40%, rgba(0,0,0,0)); opacity: 0; }
  /* Lösungen: Wischen von links */
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .ans { visibility: hidden; }
  .ans.show { visibility: visible; animation: wipe .8s ease-out both; }
  .ans.show.noanim { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .ans.show { animation: none !important; }
  }

  /* Tiefe: Karten und Zeilen heben sich mit weichem Schatten vom Papier ab */
  .slide:not(.dark) .card, .slide:not(.dark) .row, .slide:not(.dark) div[style*="var(--light)"], .slide:not(.dark) .pill {
    box-shadow: 0 8px 22px rgba(60,45,30,.16), 0 1px 3px rgba(60,45,30,.12);
  }
  .slide:not(.dark) .card[style*="var(--slate)"] { box-shadow: 0 12px 30px rgba(20,22,26,.35); }
  .dark .card, .dark div[style*="var(--slate)"] { box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  /* Buchrücken links, Falz-Schatten über den Seiten */
  #deck { margin-left: 24px; }
  #spine {
    position: absolute; left: -44px; top: -5px; width: 52px; height: 730px; border-radius: 14px 0 0 14px; overflow: hidden;
    background: var(--leather), linear-gradient(90deg, #200a06 0%, #5d2318 22%, #7a3223 45%, #55200f 72%, #230b07 100%);
    box-shadow: -10px 4px 22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35);
  }
  #spine b { position: absolute; left: 0; right: 0; height: 5px; background: linear-gradient(180deg, #f3d885, #b98524 60%, #8a621a); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #spine span {
    position: absolute; left: 44%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
    font: 700 17px Cambria, Georgia, serif; letter-spacing: .14em; text-transform: uppercase;
    background: linear-gradient(180deg, #f7dc8a, #d9a93c 55%, #b98524); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.7));
  }
  #stack { z-index: 1; }
  #stack::after {
    content: ""; position: absolute; inset: 0; z-index: 20; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.34) 0, rgba(0,0,0,.14) 16px, rgba(0,0,0,.04) 44px, rgba(0,0,0,0) 80px);
  }
  /* Einband (Folie 1): Leder, Goldprägung */
  .slide.cover {
    background: var(--leather), radial-gradient(circle at 30% 18%, #7a3223 0, #5a2218 45%, #33110a 100%);
  }
  .gold { background: linear-gradient(180deg, #f7dc8a, #d9a93c 55%, #b98524); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.55)); }
  .abs { position: absolute; }
  .head { font-family: Cambria, "Cambria Math", Georgia, serif; font-weight: 700; }
  .ttl { display: flex; align-items: center; font-size: 42.67px; line-height: 1.15; }
  .pill { display: flex; align-items: center; justify-content: center; border-radius: 99px; color: #fff; font-weight: 700; font-size: 16px; background: var(--accent); }
  .lbl { font-size: 16px; font-weight: 700; text-transform: uppercase; }
  .badge { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; flex: none; }
  .foot { font-size: 13.33px; color: var(--muted); }
  .dark .foot { color: var(--softw); }
  .card { border-radius: 19px; }
  .row { display: flex; align-items: flex-start; background: var(--light); border-radius: 12px; margin-bottom: 11.5px; padding: 15px 19px 16px; }
  .row .q { font-weight: 700; margin-left: 17px; width: 259px; flex: none; }
  .row .a { margin-left: 24px; width: 778px; flex: none; }
  a { color: var(--accent); }
  table { border-collapse: collapse; }
  td, th { padding: 0 8px 0 12px; height: 48px; font-size: 18.67px; text-align: left; }
  th { background: var(--slate); color: #fff; }
  tr:nth-child(odd) td { background: var(--light); }

  #bar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: rgba(30,30,34,.9); color: #ddd; border-radius: 10px; padding: 6px 12px; font: 14px system-ui, sans-serif;
    opacity: 0; transition: opacity .25s; z-index: 10; }
  body:hover #bar { opacity: .95; }
  #bar button { font: inherit; color: #fff; background: #3a3a40; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:disabled { opacity: .4; cursor: default; }
</style>
</head>

    question: [

const QW = 2.7, AW = 8.1, MAXH = 4.95;
const estLines = (t, w, size) => Math.max(1, Math.ceil(t.length / (w * 72 / (0.45 * size))));
const rowHeights = (c, idxs, size) =>
  idxs.map(qi => Math.max(estLines(c.question[qi], QW, size), estLines(c.solution[qi], AW, size)) * size * 1.2 / 72 + 0.34);
function plan(c) {
  const n = c.question.length, all = [...Array(n).keys()];
  for (const size of [17, 16, 15, 14]) {
    if (rowHeights(c, all, size).reduce((a, b) => a + b, 0) + 0.12 * (n - 1) <= MAXH) return { chunks: [all], sizes: [size] };
  }
  const hs = rowHeights(c, all, 15), chunks = [];
  let cur = [], h = 0;
  for (const qi of all) {
    let add = hs[qi] + (cur.length ? 0.12 : 0);
    if (cur.length && h + add > MAXH) { chunks.push(cur); cur = []; h = 0; add = hs[qi]; }
    cur.push(qi); h += add;
  }
  chunks.push(cur);
  return { chunks, sizes: chunks.map(() => 15) };
}

// schneidet ein Polygon an der Faltlinie; behält die Seite, auf der d<=0 (front) bzw. d>=0 (folded)
function clipPoly(poly, M, n, keepFront) {
  const sgn = keepFront ? -1 : 1;
  const d = p => ((p[0] - M.x) * n.x + (p[1] - M.y) * n.y) * sgn;
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], da = d(a), db = d(b);
    if (da >= 0) out.push(a);
    if ((da >= 0) !== (db >= 0)) {
      const k = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    }
  }
  return out;
}

  shadowWrap.append(shadowRot);
  // umgeklappte Rückseite (Papier mit leicht durchscheinendem Spiegelbild der Vorderseite)
  const flapOuter = mk("position:absolute;inset:0;z-index:4;pointer-events:none;filter:drop-shadow(-6px 8px 10px rgba(0,0,0,.4))");
  const flapClip = mk("position:absolute;inset:0");
  const isCover = turn.classList.contains("cover");
  const flap = mk("position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:" + (isCover
    ? "radial-gradient(circle at 30% 25%, #8f3b2b, #4d1c14 78%)"
    : "linear-gradient(90deg,#e7e2d7,#f7f3ea 50%,#e5e0d4)"));
  const ghost = turn.cloneNode(true);
  ghost.classList.remove("active");
  ghost.querySelectorAll(".ans.show").forEach(a => a.classList.add("noanim"));
  Object.assign(ghost.style, { visibility: "visible", opacity: isCover ? ".05" : ".08", zIndex: "auto", clipPath: "none" });
  flap.append(ghost);
  const hiRot = mk("position:absolute;left:0;top:0;width:0;height:0");
  hiRot.append(mk("position:absolute;left:-2600px;top:0;width:5200px;height:110px;background:linear-gradient(to bottom, rgba(0,0,0,.34), rgba(255,255,255,.42) 20%, rgba(0,0,0,.07) 70%, rgba(0,0,0,0))"));
  flapClip.append(flap, hiRot);
  flapOuter.append(flapClip);
  stack.append(shadowWrap, flapOuter);
  turn.style.zIndex = 2; under.style.zIndex = 1;

  return {
    update(p) {
      if (p <= 0.0004) {
        turn.style.clipPath = "none";
        shadowWrap.style.display = flapOuter.style.display = "none";
        return;
      }
      shadowWrap.style.display = flapOuter.style.display = "";
      // Die Ecke (1280,0) wird nach links gezogen und dabei leicht nach unten geführt
      const Q = { x: 1280 - 2700 * p, y: 520 * Math.sin(Math.PI * p) };
      const dx = 1280 - Q.x, dy = 0 - Q.y, len = Math.hypot(dx, dy);
      const n = { x: dx / len, y: dy / len };            // zeigt von der gezogenen Ecke zur Originalecke
      const M = { x: (1280 + Q.x) / 2, y: Q.y / 2 };      // Faltlinie = Mittelsenkrechte
      const front = clipPoly(RECT, M, n, true);
      const folded = clipPoly(RECT, M, n, false);
      turn.style.clipPath = polyCss(front);
      shadowWrap.style.clipPath = polyCss(folded);
      const refl = folded.map(pt => {
        const d = (pt[0] - M.x) * n.x + (pt[1] - M.y) * n.y;
        return [pt[0] - 2 * d * n.x, pt[1] - 2 * d * n.y];
      });
      flapClip.style.clipPath = polyCss(refl);
      const mn = M.x * n.x + M.y * n.y;
      flap.style.transform = `matrix(${1 - 2 * n.x * n.x},${-2 * n.x * n.y},${-2 * n.x * n.y},${1 - 2 * n.y * n.y},${2 * mn * n.x},${2 * mn * n.y})`;
      const phi = Math.atan2(n.x, -n.y) * 180 / Math.PI;  // Richtung der Faltlinie
      const tr = `translate(${M.x}px,${M.y}px) rotate(${phi}deg)`;
      shadowRot.style.transform = hiRot.style.transform = tr;
      shadowWrap.style.opacity = (clamp(p * 10, 0, 1) * (1 - clamp((p - 0.55) / 0.45, 0, 1))).toFixed(3);
    },
    cleanup() {
      shadowWrap.remove(); flapOuter.remove();
      turn.style.clipPath = ""; turn.style.zIndex = ""; under.style.zIndex = "";
    }
  };
}

function runPeel(turn, under, p0, p1, after) {
  const model = buildPeel(turn, under);
  const dur = 2800, t0 = performance.now();
  const c = { raf: 0, done() { model.update(p1); model.cleanup(); after(); } };
  curl = c;
  model.update(p0);
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    model.update(p0 + (p1 - p0) * easeInOut(t));
    if (t < 1) c.raf = requestAnimationFrame(step);
    else { curl = null; c.done(); }
  };
  c.raf = requestAnimationFrame(step);
}

function finishTurn() {
  if (!curl) return;
  const c = curl; curl = null;
  cancelAnimationFrame(c.raf);
  c.done();
}

function show(n, init) {
  finishTurn();
  const from = idx;
  idx = clamp(n, 0, els.length - 1);
  els.forEach(el => el.classList.remove("active"));
  resetAnswers(els[idx], idx < from);
  if (init || reduced || from === idx) {
    els[idx].classList.add("active");
  } else if (idx > from) {
    // vorwärts: die aktuelle Folie wird von der oberen rechten Ecke aus nach links weggeblättert
    const turn = els[from], under = els[idx];
    turn.classList.add("active"); under.classList.add("active");
    runPeel(turn, under, 0, 1, () => turn.classList.remove("active"));
  } else {
    // zurück: die vorherige Folie wird von links wieder zur rechten Ecke zurückgeblättert
    const turn = els[idx], under = els[from];
    turn.classList.add("active"); under.classList.add("active");
    runPeel(turn, under, 1, 0, () => under.classList.remove("active"));
  }
  document.getElementById("counter").textContent = `${idx + 1} / ${els.length}`;
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === els.length - 1;
  try { history.replaceState(null, "", "#" + (idx + 1)); } catch (e) {}
}

// Weiter: erst die nächste Lösung einblenden, danach die nächste Folie
function advance() {
  const hidden = [...els[idx].querySelectorAll(".ans:not(.show)")];
  if (hidden.length) hidden[0].classList.add("show");
  else show(idx + 1);
}
function back() { show(idx - 1); }

document.getElementById("prev").onclick = e => { e.stopPropagation(); back(); };
document.getElementById("next").onclick = e => { e.stopPropagation(); advance(); };
document.getElementById("fs").onclick = e => { e.stopPropagation(); toggleFs(); };
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
}
document.getElementById("deck").addEventListener("click", e => { if (!e.target.closest("a")) advance(); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " " || e.key === "Enter") { e.preventDefault(); advance(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") { e.preventDefault(); back(); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(els.length - 1);
  else if (e.key === "f" || e.key === "F") toggleFs();
});

show(idx, true);
</script>
</body>
</html>
